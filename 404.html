<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Page Not Found · DryShield</title>
  <link rel="icon" type="image/jpeg" href="images/basement.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle ambient glow behind the 404 — blue now */
    body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(0, 136, 204, 0.08), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== 404 CONTENT ===== */
    .error-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 720px;
      width: 100%;
    }

    /* Big "404" — first + last digit blue, middle white */
    .error-code {
      font-family: 'Inter', sans-serif;
      font-size: 10rem;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -8px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    .error-code .digit {
      display: inline-block;
      color: #0088cc;
      text-shadow: 0 0 60px rgba(0, 136, 204, 0.55), 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .error-code .digit.zero {
      color: #ffffff;
      text-shadow: 0 0 60px rgba(255, 255, 255, 0.35), 0 4px 20px rgba(0, 0, 0, 0.5);
      margin: 0 0.02em;
    }

    /* Subtitle */
    .error-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 1.2rem;
    }
    .error-title .highlight {
      color: #4db8ff;
      text-shadow: 0 0 40px rgba(77, 184, 255, 0.4);
    }

    /* Paragraph */
    .error-text {
      font-size: 1.05rem;
      color: #b8c4cc;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 2.2rem;
    }

    /* Back button — blue */
    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #0088cc;
      color: #ffffff;
      border: none;
      padding: 1rem 2.2rem;
      border-radius: 60px;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.25s ease;
      box-shadow: 0 10px 30px rgba(0, 136, 204, 0.35), 0 0 0 0 rgba(0, 136, 204, 0.5);
    }
    .error-btn i {
      font-size: 0.9rem;
      transition: transform 0.25s ease;
    }
    .error-btn:hover {
      background: #0066a1;
      transform: translateY(-3px);
      box-shadow: 0 16px 40px rgba(0, 136, 204, 0.5), 0 0 0 8px rgba(0, 136, 204, 0.08);
    }
    .error-btn:hover i {
      transform: translateX(-4px);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 767px) {
      .error-code { font-size: 7rem; letter-spacing: -5px; margin-bottom: 1.2rem; }
      .error-title { font-size: 1.6rem; margin-bottom: 1rem; }
      .error-text { font-size: 0.95rem; margin-bottom: 1.8rem; }
      .error-btn { padding: 0.85rem 1.8rem; font-size: 0.9rem; }
    }
    @media (max-width: 480px) {
      .error-code { font-size: 5.2rem; letter-spacing: -4px; margin-bottom: 1rem; }
      .error-title { font-size: 1.3rem; letter-spacing: -0.3px; }
      .error-text { font-size: 0.85rem; line-height: 1.65; margin-bottom: 1.5rem; padding: 0 0.5rem; }
      .error-btn { padding: 0.75rem 1.6rem; font-size: 0.82rem; gap: 8px; }
      body::before { width: 500px; height: 500px; }
    }
    @media (max-width: 360px) {
      .error-code { font-size: 4.2rem; letter-spacing: -3px; }
      .error-title { font-size: 1.1rem; }
      .error-text { font-size: 0.78rem; }
      .error-btn { padding: 0.65rem 1.4rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="error-wrap">
    <div class="error-code">
      <span class="digit">4</span>
      <span class="digit zero">0</span>
      <span class="digit">4</span>
    </div>

    <h1 class="error-title">Lost <span class="highlight">Brushstroke</span></h1>

    <p class="error-text">
      Oops! The page you're looking for seems to have been painted over. Let's get you back on track.
    </p>

    <a href="index.html" class="error-btn">
      <i class="fas fa-arrow-left"></i>
      Back to DryShield
    </a>
  </div>

</body>
</html>
